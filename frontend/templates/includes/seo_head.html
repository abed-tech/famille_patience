{# Métadonnées SEO + partage social + multi-appareils — Famille Patience #}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ec4899" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#be185d" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>{{ seo_title|default:"Famille Patience" }}</title>
<meta name="description" content="{{ seo_description|default:'' }}">
<meta name="robots" content="{{ seo_robots|default:'index, follow' }}">
<meta name="author" content="Famille Patience">
<meta name="application-name" content="Famille Patience">
<link rel="canonical" href="{{ seo_canonical }}">

{# Open Graph #}
<meta property="og:type" content="{{ seo_type|default:'website' }}">
<meta property="og:locale" content="{{ seo_locale|default:'fr_FR' }}">
<meta property="og:site_name" content="{{ seo_site_name|default:'Famille Patience' }}">
<meta property="og:title" content="{{ seo_title|default:'Famille Patience' }}">
<meta property="og:description" content="{{ seo_description|default:'' }}">
<meta property="og:url" content="{{ seo_canonical }}">
<meta property="og:image" content="{{ seo_image }}">
<meta property="og:image:alt" content="{{ seo_site_name|default:'Famille Patience' }}">

{# Twitter / X #}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title|default:'Famille Patience' }}">
<meta name="twitter:description" content="{{ seo_description|default:'' }}">
<meta name="twitter:image" content="{{ seo_image }}">

{# Icônes multi-navigateurs / iOS / Android #}
<link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Famille Patience">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="msapplication-TileColor" content="#ec4899">
<meta name="msapplication-TileImage" content="/static/icons/icon-192.png">

<script type="application/ld+json">{{ seo_json_ld|safe }}</script>
